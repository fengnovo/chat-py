[project]
name = "agent-api"
version = "0.1.0"
description = "FastAPI Agent API — BFF layer"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.20",
    "arq>=0.26",
    "contracts",
    "db",
    "artifacts",
    "observability",
    "memory-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
