[project]
name = "worker"
version = "0.1.0"
description = "Agent worker — async job consumer replacing the BullMQ worker"
requires-python = ">=3.13"
dependencies = [
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "langchain",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langfuse",
    "contracts",
    "db",
    "artifacts",
    "observability",
    "memory-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
