[project]
name = "contracts"
version = "0.1.0"
description = "Pydantic schemas for agent platform events, runs, and queue payloads"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
