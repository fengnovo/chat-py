[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-graphrag"
version = "0.1.0"
description = "Knowledge GraphRAG package with LlamaIndex integration"
requires-python = ">=3.10"
dependencies = [
    "llama-index>=0.12",
    "llama-index-vector-stores-qdrant",
    "llama-index-embeddings-openai",
    "llama-index-readers-file",
    "qdrant-client",
    "pydantic>=2.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_graphrag"]
