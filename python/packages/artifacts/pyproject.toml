[project]
name = "artifacts"
version = "0.1.0"
description = "Async S3 artifact store for agent platform object storage"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=13.0",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifacts"]
