[project]
name = "agent-core"
version = "0.1.0"
description = "Headless deep agent runtime: resilient model routing, MCP tools, sandboxes, subagent orchestration"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-mcp-adapters",
    "e2b",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
