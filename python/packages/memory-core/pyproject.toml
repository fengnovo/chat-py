[project]
name = "memory-core"
version = "0.1.0"
description = "Memory domain types and sensitivity policy for the agent platform"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_core"]
