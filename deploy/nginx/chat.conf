# /etc/nginx/conf.d/chat.conf
#
# 结构：
#   chat.example.com:443   → Web(3020) + API(8002)，API 直连绕过 Next，SSE 少一跳
#                            另把 /agent-artifacts/ 同源反代到 MinIO(59000)，预签名直传/下载走这里
#   chat.example.com:9443  → MinIO(59000) 的备选入口（需安全组放行；主链路不依赖）
#
# 替换 chat.example.com 为你的域名；证书路径按实际修改。

upstream chat_web   { server 127.0.0.1:3020;  keepalive 16; }
upstream chat_api   { server 127.0.0.1:8002;  keepalive 16; }
upstream chat_minio { server 127.0.0.1:59000; keepalive 16; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ---------- HTTP：仅用于跳转和 ACME 校验 ----------
server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 主站 ----------
server {
    # Debian 12 自带 nginx 1.22，只支持这种写法；nginx ≥1.25.1 可改成
    #   listen 443 ssl;  +  http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Fastify bodyLimit = max(1MB, PROJECT_UPLOAD_MAX_BYTES*2) = 40MB，这里留足余量
    client_max_body_size 50m;

    # ---- 流式（SSE）必需：整段关闭缓冲 ----
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Only W3C trace context crosses the public telemetry boundary.
    proxy_set_header X-Request-Id       $http_x_request_id;
    proxy_set_header traceparent        $http_traceparent;
    proxy_set_header tracestate         $http_tracestate;
    proxy_set_header baggage            "";
    proxy_set_header X-Trace-Id         "";
    proxy_set_header X-Span-Id          "";
    proxy_set_header X-Internal-Telemetry "";
    proxy_set_header X-Observability-Context "";
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;

    # API 直连：聊天流式、历史、SSE 全部走这里
    location /api/ {
        proxy_pass http://chat_api;
    }

    # 对象存储预签名直传/下载（同源，免开 9443、免 CORS）。
    # 预签名 URL 形如 https://chat.example.com/agent-artifacts/tenants/...，
    # 由 API 的 S3_PUBLIC_ENDPOINT=https://chat.example.com 生成。
    # SigV4 签名包含 host，本 server 已设置 Host=$http_host（默认端口，不带 :443），改动需同步 env。
    location /agent-artifacts/ {
        client_max_body_size 200m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://chat_minio;
    }

    # 知识库页面本次不部署 knowledge-service，建议先挡掉，避免出现"能上传但永远索引中"。
    # 启用知识库后删掉这段即可。
    location = /knowledge {
        return 404;
    }

    location / {
        proxy_pass http://chat_web;
    }
}

# ---------- 对象存储（预签名 URL） ----------
# 用独立端口而不是子域名，省一条 DNS 记录；证书用同一张。
server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200m;
    # MinIO 需要原始 header
    ignore_invalid_headers off;

    proxy_http_version 1.1;
    # 必须保留端口：SigV4 签名里包含 Host，丢了端口会 SignatureDoesNotMatch
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://chat_minio;
    }
}
