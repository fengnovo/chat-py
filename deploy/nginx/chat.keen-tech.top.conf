# /etc/nginx/conf.d/chat.conf
#
# 结构：
#   chat.keen-tech.top:443   → Web(3020) + API(8002)，API 直连绕过 Next，SSE 少一跳
#                             另把 /agent-artifacts/ 同源反代到 MinIO(59000)，预签名直传/下载走这里
#   chat.keen-tech.top:9443  → MinIO(59000) 的备选入口（需安全组放行；当前主链路不依赖）
#
# 域名：chat.keen-tech.top
# 服务器：101.96.208.160（Nginx 与应用同机，upstream 走回环）

# 应用在 .env 中绑定 127.0.0.1，upstream 必须用回环；写公网 IP 连不上
upstream chat_web   { server 127.0.0.1:3020;  keepalive 16; }
upstream chat_api   { server 127.0.0.1:8002;  keepalive 16; }
upstream chat_minio { server 127.0.0.1:59000; keepalive 16; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ---------- HTTP：仅用于跳转和 ACME 校验 ----------
server {
    listen 80;
    listen [::]:80;
    server_name chat.keen-tech.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 主站 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.keen-tech.top;

    ssl_certificate     /etc/nginx/ssl/keen-tech.top.crt;
    ssl_certificate_key /etc/nginx/ssl/keen-tech.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Fastify bodyLimit = max(1MB, PROJECT_UPLOAD_MAX_BYTES*2) = 40MB，这里留足余量
    client_max_body_size 50m;

    # ---- 流式（SSE）必需：整段关闭缓冲 ----
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;

    # API 直连：聊天流式、历史、SSE 全部走这里
    location /api/ {
        proxy_pass http://chat_api;
    }

    # 对象存储预签名直传/下载（同源，免开 9443、免 CORS）。
    # 预签名 URL 形如 https://chat.keen-tech.top/agent-artifacts/tenants/...，
    # 由 API 的 S3_PUBLIC_ENDPOINT=https://chat.keen-tech.top 生成。
    # SigV4 签名包含 host，本 server 已设置 Host=$http_host（默认端口，不带 :443），改动需同步 env。
    location /agent-artifacts/ {
        client_max_body_size 200m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://chat_minio;
    }

    # 知识库页面已部署，放行
    location /knowledge {
        proxy_pass http://chat_web;
    }

    location / {
        proxy_pass http://chat_web;
    }
}

# ---------- 对象存储（预签名 URL） ----------
# 用独立端口而不是子域名，省一条 DNS 记录；证书用同一张。
server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name chat.keen-tech.top;

    ssl_certificate     /etc/nginx/ssl/keen-tech.top.crt;
    ssl_certificate_key /etc/nginx/ssl/keen-tech.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200m;
    # MinIO 需要原始 header
    ignore_invalid_headers off;

    proxy_http_version 1.1;
    # 必须保留端口：SigV4 签名里包含 Host，丢了端口会 SignatureDoesNotMatch
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # ---- CORS：只允许主站跨域访问预签名 URL ----
    # 浏览器从 chat.keen-tech.top(443) 请求 chat.keen-tech.top:9443 属于跨域
    set $cors_origin "";
    if ($http_origin = "https://chat.keen-tech.top") {
        set $cors_origin $http_origin;
    }

    location / {
        # 预检请求（OPTIONS）直接返回，不转发给 MinIO
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-amz-meta-sha256, authorization" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Content-Length               0 always;
            add_header Content-Type                 "text/plain" always;
            return 204;
        }

        # 实际请求附带 CORS 头
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "content-type, x-amz-meta-sha256, authorization" always;
        proxy_pass http://chat_minio;
    }
}
