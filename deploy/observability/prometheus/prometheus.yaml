# Prometheus：主要作为 Alloy remote-write 的落盘端 + 告警评估器。
# 自身只抓自己和 Alloy 自监控；业务指标全部来自 OTLP -> Alloy remote-write。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: chat
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          component: alloy

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3100"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
